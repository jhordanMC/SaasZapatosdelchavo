<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">{{ title }}</span>
    <span class="topbar-badge">Admin</span>
  </div>

  <div class="topbar-right">
    <button class="topbar-action" aria-label="Notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot"></span>
    </button>
    <div class="topbar-company">{{ company }}</div>
    <div class="topbar-avatar" (click)="openProfile()">
      <img *ngIf="!showAvatarFallback" [src]="avatarSrc" alt="Avatar" class="avatar-img" (error)="showAvatarFallback = true" />
      <span *ngIf="showAvatarFallback">{{ avatarLabel }}</span>
    </div>
  </div>
</header>

<!-- ══ MODAL: Ver perfil ══ -->
<div class="profile-modal-overlay" *ngIf="showProfileModal" (click)="closeProfile()">
  <div class="profile-modal-card" (click)="$event.stopPropagation()">
    <button class="profile-modal-close" (click)="closeProfile()" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="profile-modal-brand">
      <img [src]="logoSrc" alt="VILCAS" class="profile-modal-logo" />
      <div class="profile-modal-brand-name">
        <span
          *ngFor="let char of brandName.split(''); let i = index"
          [ngClass]="{ dk: i !== brandAccentIndex, gd: i === brandAccentIndex }"
        >{{ char }}</span>
      </div>
    </div>

    <div class="profile-modal-body">
      <div class="profile-avatar-lg">
        <img *ngIf="!showAvatarFallback" [src]="avatarSrc" alt="Avatar" class="avatar-img" />
        <span *ngIf="showAvatarFallback">{{ avatarLabel }}</span>
      </div>
      <div class="profile-name">{{ userName }}</div>
      <div class="profile-role">{{ userRole }}</div>
    </div>

    <div class="profile-info-list">
      <div class="profile-info-row">
        <span class="profile-info-label">ID de usuario</span>
        <span class="profile-info-value">{{ userId }}</span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">DNI</span>
        <span class="profile-info-value">{{ userDni }}</span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">Correo</span>
        <span class="profile-info-value">{{ userEmail }}</span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">Teléfono</span>
        <span class="profile-info-value">{{ userPhone }}</span>
      </div>
    </div>

    <div class="profile-modal-actions">
      <button class="profile-btn-logout" (click)="cerrarSesion()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
      <button class="profile-btn-secondary" (click)="closeProfile()">Cerrar</button>
    </div>
  </div>
</div>
