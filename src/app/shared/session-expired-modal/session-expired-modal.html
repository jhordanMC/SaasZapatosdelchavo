<div class="session-modal-overlay" *ngIf="sesionExpirada()">
  <div class="session-modal-card">
    <app-modal-brand-header subtitle="Sesión expirada" (cerrar)="onAceptar()" />

    <div class="session-modal-body">
      <div class="session-modal-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15.5 14"/>
        </svg>
      </div>
      <h2 class="session-modal-titulo">Tu sesión ha expirado</h2>
      <p class="session-modal-desc">Por tu seguridad cerramos tu sesión automáticamente. Inicia sesión nuevamente para continuar.</p>
    </div>

    <div class="session-modal-actions">
      <button class="session-modal-btn" (click)="onAceptar()">Ir a iniciar sesión</button>
    </div>
  </div>
</div>
