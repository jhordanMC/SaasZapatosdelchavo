<app-sidebar
  [items]="navItems"
  [avatarLabel]="iniciales()"
  [userName]="usuario()?.nombre ?? 'Usuario'"
  [userRole]="rolEtiqueta()"
  [userId]="usuario()?.idUsuario ?? '—'"
  [userDni]="usuario()?.dni ?? '—'"
  [userEmail]="usuario()?.correo ?? '—'"
  [userPhone]="usuario()?.telefono ?? '—'"
  brandName="VILCAS"
  brandSub="SaaS Platform"
  logoSrc="/vilcas.png"
></app-sidebar>

<div class="main">
  <app-topbar
    [title]="pageTitleService.title()"
    company="Mi Empresa"
    [avatarLabel]="iniciales()"
    [userName]="usuario()?.nombre ?? 'Usuario'"
    [userRole]="rolEtiqueta()"
    [userId]="usuario()?.idUsuario ?? '—'"
    [userDni]="usuario()?.dni ?? '—'"
    [userEmail]="usuario()?.correo ?? '—'"
    [userPhone]="usuario()?.telefono ?? '—'"
  ></app-topbar>

  <router-outlet></router-outlet>
</div>
