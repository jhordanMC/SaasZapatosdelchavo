<div class="toast-stack" *ngIf="toasts.length > 0" aria-live="polite">
  <div
    class="toast-card"
    *ngFor="let toast of toasts"
    [class.severidad-info]="toast.severidad === 'info'"
    [class.severidad-advertencia]="toast.severidad === 'advertencia'"
    [class.severidad-critica]="toast.severidad === 'critica'"
  >
    <div class="toast-icono">
      <svg *ngIf="toast.severidad === 'info'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <svg *ngIf="toast.severidad === 'advertencia'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <svg *ngIf="toast.severidad === 'critica'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <div class="toast-texto">
      <span class="toast-titulo">{{ toast.titulo }}</span>
      <span class="toast-mensaje">{{ toast.mensaje }}</span>
    </div>

    <button class="toast-cerrar" (click)="cerrarToast(toast.id)" aria-label="Cerrar aviso">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>
