<div class="notfound-page">
  <div class="notfound-card">
    <app-modal-brand-header subtitle="Página no encontrada" (cerrar)="volverAlInicio()" />

    <div class="notfound-body">
      <div class="notfound-codigo">404</div>
      <p class="notfound-desc">La página que buscas no existe o fue movida.</p>

      <button class="notfound-btn" (click)="volverAlInicio()">Volver al inicio</button>
    </div>
  </div>
</div>
