<div class="bg"></div>
<div class="page"><div class="card-wrap"><div class="card">
  <div class="logo-area"><img src="vilcas.png" alt="Vilcas" class="logo-img"><div class="brand-name">VILC<span class="gd">A</span>S</div></div>
  <div class="form-area" *ngIf="!done">
    <div class="heading">Crea tu nueva contraseña</div>
    <p class="subheading">Usa al menos 8 caracteres.</p>
    <form (ngSubmit)="submit()">
      <div class="field"><input name="password" type="password" autocomplete="new-password" [(ngModel)]="password" placeholder="Nueva contraseña" aria-label="Nueva contraseña" minlength="8" required [disabled]="loading"></div>
      <div class="field"><input name="confirm" type="password" autocomplete="new-password" [(ngModel)]="confirm" placeholder="Repite la contraseña" aria-label="Repite la contraseña" required [disabled]="loading"></div>
      <p *ngIf="error" class="recovery-error" role="alert">{{ error }}</p>
      <button class="btn-login" type="submit" [class.loading]="loading" [disabled]="loading || !valid"><span>Guardar contraseña</span></button>
    </form>
    <a routerLink="/olvide-contrasena" class="back-link">Solicitar otro enlace</a>
  </div>
  <div class="success-area" *ngIf="done"><div class="suc-title">¡Contraseña actualizada!</div><p class="suc-sub">Ya puedes iniciar sesión con tu nueva contraseña.</p></div>
  <a routerLink="/login" class="back-link">Volver a iniciar sesión</a>
  <div class="sec-line">Powered by ALBA <img src="LogoAlba.png" alt="Alba" class="alba-logo"></div>
</div></div></div>
