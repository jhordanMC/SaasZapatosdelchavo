<!-- Fondo -->
<div class="bg"></div>


<!-- LOGIN -->
<div class="page">
  <div class="card-wrap" #cardWrap>

    <div class="card">
      <div class="logo-area">
        <a href="https://www.vilcaspe.com/" target="_blank" rel="noopener noreferrer" title="Ir a VILCAS web">
          <img src="vilcas.png" alt="Vilcas" class="logo-img" (error)="onLogoError($event)"/>
        </a>
        <svg *ngIf="showLogoFallback" class="logo-fallback" style="display:block" viewBox="0 0 68 56" fill="none">
          <polygon points="12,4 20,4 34,44 48,4 56,4 34,52 12,4" fill="#024B40"/>
          <polygon points="20,4 28,4 34,28 40,4 48,4 34,44 20,4" fill="#DA9E0B"/>
        </svg>
        <div class="brand-name">VILC<span class="gd">A</span>S</div>
      </div>

      <div class="form-area" *ngIf="!success">

        <div class="err-msg" [class.on]="showError">{{ errorMessage }}</div>

        <div class="field">
          <span class="ico-l">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
            </svg>
          </span>
          <input type="email" name="email" placeholder="{{ 'LOGIN.CORREO_PLACEHOLDER' | t }}" autocomplete="email"
                 [(ngModel)]="email" [class.shake]="shakeEmail"/>
        </div>

        <div class="field">
          <span class="ico-l">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" name="password" placeholder="{{ 'LOGIN.PASSWORD_PLACEHOLDER' | t }}"
                 autocomplete="current-password" [(ngModel)]="password" [class.shake]="shakePassword"/>
          <button class="ico-r" type="button" aria-label="Mostrar contraseña" (click)="togglePwd()">
            <svg *ngIf="!showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <div class="extras">
          <label class="remember">
            <input type="checkbox" name="remember" [(ngModel)]="remember"/> {{ 'LOGIN.RECORDARME' | t }}
          </label>
          <a routerLink="/olvide-contrasena" class="forgot">{{ 'LOGIN.OLVIDE_PASSWORD' | t }}</a>
        </div>

        <button class="btn-login" type="button" [class.loading]="loading" [disabled]="loading" (click)="tryLogin()">
          <span>{{ 'LOGIN.INICIAR_SESION' | t }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <div class="reg">{{ 'LOGIN.SIN_CUENTA' | t }}
          <a href="https://wa.me/51957306279" target="_blank" rel="noopener">{{ 'LOGIN.CONTACTAR_VENTAS' | t }}</a>
        </div>

        <div class="sec-line">
          {{ 'LOGIN.POWERED_BY' | t }}
          <img src="LogoAlba.png" alt="Alba" class="alba-logo"/>
        </div>
      </div>

      <div class="success-area" *ngIf="success">
        <div class="suc-ring">
          <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#3db87a" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div class="suc-title">{{ 'LOGIN.PASSWORD_CORRECTA' | t }}</div>
        <div class="suc-sub">{{ 'LOGIN.CODIGO_ENVIADO' | t }}<br>{{ 'LOGIN.REDIRIGIENDO_2FA' | t }}</div>
      </div>
    </div>
  </div>
</div>
