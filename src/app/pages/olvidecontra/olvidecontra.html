<!-- Fondo (idéntico al login) -->
<div class="bg"></div>



<!-- Olvidé contraseña -->
<div class="page">
  <div class="card-wrap">
    <div class="card">
      <div class="logo-area">
        <img src="vilcas.png" alt="Vilcas" class="logo-img" (error)="onLogoError($event)"/>
        <svg *ngIf="showLogoFallback" class="logo-fallback" style="display:block" viewBox="0 0 68 56" fill="none">
          <polygon points="12,4 20,4 34,44 48,4 56,4 34,52 12,4" fill="#024B40"/>
          <polygon points="20,4 28,4 34,28 40,4 48,4 34,44 20,4" fill="#DA9E0B"/>
        </svg>
        <div class="brand-name">VILC<span class="gd">A</span>S</div>
      </div>

      <!-- Estado: formulario -->
      <div class="form-area" *ngIf="!emailSent">
        <div class="icon-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#024B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            <circle cx="12" cy="16" r="1.4" fill="#024B40" stroke="none"/>
          </svg>
        </div>

        <div class="heading">¿Olvidaste tu contraseña?</div>
        <div class="subheading">Ingresa tu correo y te enviaremos un enlace para restablecerla</div>

        <form (ngSubmit)="onSubmit()">
          <div class="field">
            <span class="ico-l">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
              </svg>
            </span>
            <input type="email" placeholder="Correo electrónico" autocomplete="email" name="email"
                   [(ngModel)]="email" required/>
          </div>

          <button class="btn-login" type="submit" [class.loading]="loading" [disabled]="loading">
            <span>Enviar enlace</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <a routerLink="/login" class="back-link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver a iniciar sesión
        </a>

        <div class="sec-line">
          Powered by ALBA
          <img src="LogoAlba.png" alt="Alba" class="alba-logo"/>
        </div>
      </div>

      <!-- Estado: enlace enviado -->
      <div class="success-area" *ngIf="emailSent">
        <div class="suc-ring">
          <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#3db87a" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div class="suc-title">¡Revisa tu correo!</div>
        <div class="suc-sub">
          Enviamos un enlace de recuperación a<br/>
          <strong>{{ email }}</strong>
        </div>

        <button class="btn-sso" type="button" (click)="onResend()" [disabled]="loading">
          <span *ngIf="!loading">Reenviar enlace</span>
          <span *ngIf="loading">Enviando...</span>
        </button>

        <a routerLink="/login" class="back-link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver a iniciar sesión
        </a>

        <div class="sec-line">
          Powered by ALBA
          <img src="LogoAlba.png" alt="Alba" class="alba-logo"/>
        </div>
      </div>
    </div>
  </div>
</div>
