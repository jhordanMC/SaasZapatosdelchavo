<div class="de-layout">
  <div class="de-side">
    <div class="de-tabs" role="tablist">
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          role="tab"
          class="de-tab"
          [class.active]="activeTab() === tab.key"
          [attr.aria-selected]="activeTab() === tab.key"
          (click)="setTab(tab.key)"
        >
          <span class="de-tab-icon">
            @switch (tab.icon) {
              @case ('box') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              }
              @case ('globe') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              }
              @case ('cart') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              }
              @case ('coin') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 1.5c1.5 0 2.5-1 2.5-2s-1-1.7-2.5-2-2.5-1-2.5-2 1-2 2.5-2a2.5 2.5 0 0 1 2.5 1.5"/><line x1="12" y1="6" x2="12" y2="18"/></svg>
              }
            }
          </span>
          {{ tab.label }}
        </button>
      }
    </div>

    <ul class="de-checklist">
      @for (item of activeChecklist; track item) {
        <li>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          {{ item }}
        </li>
      }
    </ul>
  </div>

  <div class="de-panel">
    <div class="de-panel-topbar">
      <span class="de-dot"></span>
      <span class="de-dot"></span>
      <span class="de-dot"></span>
      <span class="de-panel-title">Demo interactiva</span>
    </div>
    <div class="de-cards">
      @for (card of activeCards; track card.titulo) {
        <div class="de-card">
          @if (card.badge) {
            <span class="de-card-badge">{{ card.badge }}</span>
          }
          <span class="de-card-thumb"></span>
          <strong class="de-card-title">{{ card.titulo }}</strong>
          <span class="de-card-meta">{{ card.linea1 }}</span>
          <span class="de-card-meta">{{ card.linea2 }}</span>
          <span class="de-card-price">{{ card.destaque }}</span>
        </div>
      }
    </div>
  </div>
</div>
